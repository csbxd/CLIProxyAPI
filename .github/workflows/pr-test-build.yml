name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tags: ["", "utls", "codex_rs", "codex_rs,utls"]
    env:
      CGO_ENABLED: '1'
      BUILD_TAGS: ${{ matrix.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Build
        run: |
          go build -tags="$BUILD_TAGS" -o test-output ./cmd/server
          rm -f test-output
      - name: Test
        run: go test -tags="$BUILD_TAGS" ./...
